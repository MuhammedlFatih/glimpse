<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glimpse</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px; min-height: 200px; max-height: 560px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff; color: #1a1a1a;
      overflow: hidden; display: flex; flex-direction: column;
    }

    /* Header */
    .header {
      padding: 13px 16px; border-bottom: 0.5px solid #f0f0f0;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 7px; }
    .logo {
      width: 22px; height: 22px; background: #EAF3DE;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 13px; height: 13px; }
    .brand-name { font-size: 14px; font-weight: 500; color: #27500A; }
    .pro-badge {
      font-size: 10px; background: #EAF3DE; color: #3B6D11;
      padding: 2px 8px; border-radius: 10px; font-weight: 500; display: none;
    }
    #note-count { font-size: 11px; color: #aaa; }

    /* Arama */
    .search-wrap { padding: 10px 16px; border-bottom: 0.5px solid #f0f0f0; flex-shrink: 0; }
    .search-input {
      width: 100%; height: 32px;
      border: 0.5px solid #e0e0e0; border-radius: 8px;
      padding: 0 10px 0 30px; font-size: 12px; color: #1a1a1a;
      background: #fafafa url("data:image/svg+xml,%3Csvg width='13' height='13' viewBox='0 0 13 13' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='5.5' cy='5.5' r='4' stroke='%23aaa' stroke-width='1.2'/%3E%3Cpath d='M9 9l2 2' stroke='%23aaa' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat 10px center;
      outline: none;
    }
    .search-input:focus { border-color: #97C459; background-color: #fff; }

    /* Not listesi */
    .notes-wrap { flex: 1; overflow-y: auto; padding: 8px 16px; }
    .notes-wrap::-webkit-scrollbar { width: 4px; }
    .notes-wrap::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 2px; }

    .note-item {
      border: 0.5px solid #e8e8e8; border-radius: 9px;
      padding: 10px 12px; margin-bottom: 7px;
      cursor: pointer; position: relative;
    }
    .note-item:hover { border-color: #C0DD97; }
    .note-item:hover .delete-btn { opacity: 1; }
    .note-word { font-size: 13px; font-weight: 500; color: #1a1a1a; margin-bottom: 3px; padding-right: 24px; }
    .note-def { font-size: 11px; color: #888; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .note-date { font-size: 10px; color: #bbb; margin-top: 5px; }
    .delete-btn {
      position: absolute; top: 10px; right: 10px;
      width: 20px; height: 20px; background: #f5f5f5;
      border: none; border-radius: 50%; font-size: 11px; color: #aaa;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s;
    }
    .delete-btn:hover { background: #FCEBEB; color: #E24B4A; }

    /* Boş durum */
    .empty-state { text-align: center; padding: 32px 16px; color: #bbb; }
    .empty-icon {
      width: 36px; height: 36px; background: #EAF3DE;
      border-radius: 10px; margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .empty-state p { font-size: 12px; line-height: 1.6; }

    /* Footer */
    .footer {
      padding: 10px 16px; border-top: 0.5px solid #f0f0f0;
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .free-track { flex: 1; height: 4px; background: #f0f0f0; border-radius: 2px; overflow: hidden; }
    .free-fill { height: 100%; background: #639922; border-radius: 2px; transition: width 0.3s; }
    .free-text { font-size: 10px; color: #888; white-space: nowrap; }
    .export-btn {
      font-size: 10px; color: #444; background: #f5f5f5;
      border: none; border-radius: 5px; padding: 4px 8px; cursor: pointer;
    }
    .export-btn:hover { background: #ebebeb; }
    .upgrade-btn {
      font-size: 10px; color: #3B6D11; font-weight: 500;
      background: #EAF3DE; border: none;
      border-radius: 5px; padding: 4px 8px; cursor: pointer;
    }
    .upgrade-btn:hover { background: #C0DD97; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 12 12" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="#3B6D11" stroke-width="1.2"/>
          <circle cx="6" cy="6" r="1.8" fill="#3B6D11"/>
        </svg>
      </div>
      <span class="brand-name">Glimpse</span>
      <span class="pro-badge" id="pro-badge">Pro</span>
    </div>
    <span id="note-count"></span>
  </div>

  <div class="search-wrap">
    <input class="search-input" id="search" type="text" placeholder="Search saved words..." />
  </div>

  <div class="notes-wrap" id="notes-list"></div>

  <div class="footer">
    <div class="free-track"><div class="free-fill" id="free-fill"></div></div>
    <span class="free-text" id="free-text"></span>
    <button class="export-btn" id="export-btn">Export</button>
    <button class="upgrade-btn" id="upgrade-btn">Upgrade</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
